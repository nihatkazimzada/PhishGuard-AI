<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — PhishGuard AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dashboard-body">
    <nav class="topbar">
        <div class="topbar-inner">
            <a href="/dashboard" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2L4 5v6c0 5 3.5 9.4 8 11 4.5-1.6 8-6 8-11V5l-8-3z" fill="currentColor" opacity="0.25"/>
                        <path d="M12 2L4 5v6c0 5 3.5 9.4 8 11 4.5-1.6 8-6 8-11V5l-8-3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" fill="none"/>
                        <path d="M9 12l2 2 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                    </svg>
                </span>
                <span class="brand-text">PhishGuard <span class="brand-accent">AI</span></span>
            </a>
            <div class="topbar-right">
                <a href="/dashboard" class="btn btn-ghost btn-sm">← Back to Dashboard</a>
                <button class="btn btn-secondary btn-sm" id="logout-btn">Logout</button>
            </div>
        </div>
    </nav>

    <main class="content settings-content">
        <div class="view-header">
            <h1>Settings</h1>
            <p>Manage your profile and security preferences.</p>
        </div>

        <div class="toast-container"></div>

        <div class="settings-grid">
            <div class="card">
                <h2>Profile</h2>
                <p class="muted">Update your account details.</p>
                <form id="profile-form" class="form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required minlength="3" maxlength="80" />
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                    <button type="submit" class="btn btn-primary" id="profile-btn">
                        <span class="btn-label">Save Changes</span>
                        <span class="btn-spinner hidden"></span>
                    </button>
                </form>
            </div>

            <div class="card">
                <h2>Security</h2>
                <p class="muted">Change your password.</p>
                <form id="password-form" class="form">
                    <div class="form-group">
                        <label for="old_password">Current password</label>
                        <input type="password" id="old_password" name="old_password" required autocomplete="current-password" />
                    </div>
                    <div class="form-group">
                        <label for="new_password">New password</label>
                        <input type="password" id="new_password" name="new_password" required minlength="6" autocomplete="new-password" />
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm new password</label>
                        <input type="password" id="confirm_password" name="confirm_password" required minlength="6" autocomplete="new-password" />
                    </div>
                    <button type="submit" class="btn btn-primary" id="password-btn">
                        <span class="btn-label">Update Password</span>
                        <span class="btn-spinner hidden"></span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script src="/static/app.js"></script>
    <script src="/static/settings.js"></script>
</body>
</html>
